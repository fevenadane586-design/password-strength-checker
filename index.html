<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Strength Checker</title>
    <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 40px auto;
      padding: 0 16px;
    }
    #password {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      box-sizing: border-box;
    }
    #bar-container {
      background: #e0e0e0;
      border-radius: 6px;
      height: 12px;
      margin-top: 12px;
      overflow: hidden;
    }
    #bar {
      height: 100%;
      width: 0;
      background: #e0e0e0;
      transition: width 0.3s, background 0.3s;
    }
  </style>
</head>
<body>
  <h1>Password Strength Checker</h1>
  <p>Type a password below to check its strength.</p>

  <input type="text" id="password" placeholder="Enter a password">
  <div id="bar-container"><div id="bar"></div></div>
  <p id="result">Strength: waiting for input...</p>
  
       <script>
    const passwordInput = document.getElementById("password");
    const result = document.getElementById("result");
    const bar = document.getElementById("bar");

    const commonPatterns = [
      "password", "123456", "qwerty", "asdf", "letmein",
      "welcome", "admin", "iloveyou", "abc123", "111111", "123qwe"
    ];

    const colors = ["#d32f2f", "#f57c00", "#fbc02d", "#7cb342", "#2e7d32"];

    function isCommon(password) {
      const lower = password.toLowerCase();
      return commonPatterns.some(function (pattern) {
        return lower.includes(pattern);
      });
    }

    function checkStrength(password) {
      let score = 0;

      if (password.length >= 8) score++;
      if (password.length >= 12) score++;
      if (/[a-z]/.test(password) && /[A-Z]/.test(password)) score++;
      if (/[0-9]/.test(password)) score++;
      if (/[^A-Za-z0-9]/.test(password)) score++;

      return score;
    }

    passwordInput.addEventListener("input", function () {
      const password = passwordInput.value;

      if (password.length === 0) {
        result.textContent = "Strength: waiting for input...";
        bar.style.width = "0";
        return;
      }

      const labels = ["Very weak", "Weak", "Medium", "Strong", "Very strong"];
      let score = checkStrength(password);
      if (isCommon(password)) {
        score = Math.min(score, 2);
      }
      const index = Math.max(score - 1, 0);

      result.textContent = "Strength: " + labels[index] + " (" + score + "/5)";
      bar.style.width = ((index + 1) * 20) + "%";
      bar.style.background = colors[index];
    });
  </script>
</body>
</html>
