<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Strength Checker</title>
</head>
<body>
  <h1>Password Strength Checker</h1>
  <p>Type a password below to check its strength.</p>

  <input type="text" id="password" placeholder="Enter a password">

  <p id="result">Strength: waiting for input...</p>
  
      <script>
    const passwordInput = document.getElementById("password");
    const result = document.getElementById("result");

    const commonPatterns = [
      "password", "123456", "qwerty", "asdf", "letmein",
      "welcome", "admin", "iloveyou", "abc123", "111111", "123qwe"
    ];

    function isCommon(password) {
      const lower = password.toLowerCase();
      return commonPatterns.some(function (pattern) {
        return lower.includes(pattern);
      });
    }

    function checkStrength(password) {
      let score = 0;

      if (password.length >= 8) score++;
      if (password.length >= 12) score++;
      if (/[a-z]/.test(password) && /[A-Z]/.test(password)) score++;
      if (/[0-9]/.test(password)) score++;
      if (/[^A-Za-z0-9]/.test(password)) score++;

      return score;
    }

    passwordInput.addEventListener("input", function () {
      const password = passwordInput.value;

      if (password.length === 0) {
        result.textContent = "Strength: waiting for input...";
        return;
      }

      const labels = ["Very weak", "Weak", "Medium", "Strong", "Very strong"];
      let score = checkStrength(password);
      if (isCommon(password)) {
        score = Math.min(score, 2);
      }
      const label = labels[Math.max(score - 1, 0)];

      result.textContent = "Strength: " + label + " (" + score + "/5)";
    });
  </script>
</body>
</html>
