<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Strength Checker</title>
</head>
<body>
  <h1>Password Strength Checker</h1>
  <p>Type a password below to check its strength.</p>

  <input type="text" id="password" placeholder="Enter a password">

  <p id="result">Strength: waiting for input...</p>
  
  <script>
    const passwordInput = document.getElementById("password");
    const result = document.getElementById("result");

    passwordInput.addEventListener("input", function () {
      const length = passwordInput.value.length;

      if (length === 0) {
        result.textContent = "Strength: waiting for input...";
      } else {
        result.textContent = "Your password has " + length + " characters.";
      }
    });
  </script>
</body>
</html>
